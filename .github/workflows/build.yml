name: Build APK
on:
  push:
    branches: ["**"]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install NDK and CMake
        run: |
          set -o pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -20 | tee -a build.log
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee -a build.log
      - uses: actions/upload-artifact@v4
        with:
          name: inknote-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Report failure log to issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log
          { echo "Build failed: ${GITHUB_REF_NAME} @ ${GITHUB_SHA}"; echo '```'; grep -nE "error:|e: |FAILURE|What went wrong|Exception|failed" build.log | tail -80; echo '--- tail ---'; tail -c 30000 build.log; echo '```'; } > report.md
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --label ci-log --state open --json number -q '.[0].number' 2>/dev/null)
          if [ -z "$num" ]; then gh label create ci-log --repo "$GITHUB_REPOSITORY" 2>/dev/null || true; gh issue create --repo "$GITHUB_REPOSITORY" --title "CI build logs" --label ci-log --body-file report.md; else gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body-file report.md; fi
